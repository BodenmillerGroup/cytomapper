name: build-checks-devel

on:
  push:
    branches: [ devel ]
  pull_request:
    branches: [ devel ]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    container: rocker/r-ver:devel

    steps:
      - uses: actions/checkout@v4

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
        shell: Rscript {0}        
      
      - name: Install system requirements
        run: |
          apt-get update 
          apt-get install -y --no-install-recommends apt-utils 
          apt-get install -y --no-install-recommends libharfbuzz-dev libfribidi-dev zlib1g-dev libfftw3-dev libxml2-dev libpng-dev libtiff-dev libfontconfig1-dev libcurl4-gnutls-dev libcairo2-dev libssl-dev libxt-dev curl libgdal-dev libproj-dev pandoc libmagick++-dev bzip2
          apt-get clean
          rm -rf /var/lib/apt/ilists/*

      - name: Install dependencies
        run: |
         install.packages("BiocManager")
         install.packages("svglite")
         BiocManager::install(version = "devel", update = TRUE, ask = FALSE, force = TRUE) 
         remotes::install_deps(dependencies = TRUE, repos = BiocManager::repositories(), Ncpu = 2L)
        shell: Rscript {0}
        
      - name: Find PhantomJS path
        id: phantomjs
        run: |
          PHANTOM_PATH=$(Rscript -e 'if (requireNamespace("shinytest", quietly = TRUE)) cat(shinytest:::phantom_paths()[[1]])' 2>/dev/null || true)
          echo "path=$PHANTOM_PATH" >> "$GITHUB_OUTPUT"
      - name: Cache PhantomJS
        if: steps.phantomjs.outputs.path != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.phantomjs.outputs.path }}
          key: ${{ runner.os }}-phantomjs
          restore-keys: ${{ runner.os }}-phantomjs
      - name: Install PhantomJS
        run: >
          Rscript
          -e "if (requireNamespace('shinytest', quietly = TRUE) && !shinytest::dependenciesInstalled()) shinytest::installDependencies()"

      - name: Check
        run: |
          install.packages("rcmdcheck")          
          rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
        shell: Rscript {0}
        
      - name: BiocCheck
        run: |
          BiocManager::install("BiocCheck")
          BiocCheck::BiocCheck(".")
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}
